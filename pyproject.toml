[project]
name = "squad_os"
version = "0.1.0"
description = "A production-ready Multi-Agent System (MAS) framework."
authors = [
    { name = "Lead Systems Architect", email = "architect@squados.ai" }
]
dependencies = [
    "litellm==1.82.6",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "aiosqlite>=0.19.0",
    "duckduckgo-search",
    "streamlit",
    "streamlit-autorefresh",
    "fastapi",
    "playwright",
    "ffmpeg-python",
    "mss>=10.0.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "uvicorn>=0.29.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pyobjc>=10.0.0; sys_platform == 'darwin'",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.25.0"
]
test = [
    "pytest-asyncio>=0.25.0",
    "hypothesis",
    "respx",
]
mobile = [
    "zeroconf",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--ignore=tests/test_visual_tools.py"
asyncio_mode = "auto"
norecursedirs = ["workspace", "data", "_archive-ts", "mobile", "squad_os_app", "brain", "promo-video", ".git", "__pycache__", ".pytest_cache"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
