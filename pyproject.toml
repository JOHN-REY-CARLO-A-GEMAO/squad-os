[project]
name = "squad_os"
version = "0.1.0"
description = "A production-ready Multi-Agent System (MAS) framework."
authors = [
    { name = "Lead Systems Architect", email = "architect@squados.ai" }
]
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "aiosqlite>=0.19.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
