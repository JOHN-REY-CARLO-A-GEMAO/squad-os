<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Estes Landing Page - Moon Elf King</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header: JS Welcome String -->
        <header id="main-header">
            <h1 id="welcome-msg"></h1>
        </header>

        <!-- Hero: Description -->
        <section id="hero" class="glow-box">
            <h2>The Moon Elf King</h2>
            <p>Heal the world with the power of the Moon. A support that never falters, a king that never retreats.</p>
        </section>

        <!-- Information: JS Numbers -->
        <section id="info" class="glow-box">
            <h3>Mission Efficiency</h3>
            <p id="calc-result"></p>
            <button id="copy-btn" class="copy-btn" aria-label="Copy mission efficiency to clipboard">
                Copy Efficiency
            </button>
        </section>

        <!-- List: JS Array -->
        <section id="list-section" class="glow-box">
            <h3>Essential AI Agents</h3>
            <ul id="agent-list" aria-label="List of AI Agents"></ul>
        </section>

        <!-- Date: Current Date -->
        <section id="date-section" class="glow-box">
            <h3>Scroll of Time</h3>
            <p id="current-date"></p>
        </section>

        <!-- Conditional Section: Time-based greeting -->
        <section id="conditional-section" class="glow-box">
            <h3 id="greeting"></h3>
            <p>Welcome to the Moon Elf Kingdom.</p>
        </section>

        <!-- Footer: Student Info -->
        <footer>
            <div id="student-info">
                <p><strong>Name:</strong> John Rey Carlo A. Gemao</p>
                <p><strong>Course:</strong> BSIT</p>
                <p><strong>Year:</strong> 2nd Year</p>
                <p id="footer-year"></p>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
